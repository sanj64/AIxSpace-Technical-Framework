[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-dss"
version = "0.1.0"
description = "Spacecraft Anomaly Detection & Decision Support research framework"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "matplotlib",
    "plotly",
    "streamlit>=1.30",
    "joblib",
    "fpdf2",
]

[project.optional-dependencies]
research = [
    "tensorflow>=2.15",
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    "xgboost>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "black>=23.0",
    "mypy>=1.5",
    "pre-commit",
    "pandas-stubs",
    "types-PyYAML",
    "tensorflow>=2.15",
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    "xgboost>=2.0",
]

[project.scripts]
run-pipeline = "ad_dss.core.mission_engine:main"
esa-rebuild = "ad_dss.pipeline.esa_rebuild:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --basetemp=.pytest-tmp"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]
target-version = "py311"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"
