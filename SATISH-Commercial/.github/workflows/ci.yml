name: commercial-release-controls

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --editable ".[dev]" --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/satish_commercial
      - run: pytest --cov=satish_commercial --cov-report=term-missing --cov-fail-under=80
      - run: bandit -q -r src scripts
      - run: pip-audit --requirement requirements.lock
      - uses: gitleaks/gitleaks-action@v2
      - run: python scripts/generate_sbom.py --output sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            sbom.spdx.json
            schemas/

  container:
    runs-on: ubuntu-24.04
    needs: test-and-scan
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: satish-commercial:${{ github.sha }}
          load: true
          provenance: mode=max
          sbom: true
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: satish-commercial:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
