# AD-DSS Configuration — all parameters live here, no magic numbers in code

# ─── Global ───────────────────────────────────────────────────────────────────
seed: 42
log_level: "INFO"

# ─── Paths ────────────────────────────────────────────────────────────────────
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  artifacts: "data/artifacts"
  models: "models"
  reports: "data/artifacts/reports"

# ─── Telemetry Handler ────────────────────────────────────────────────────────
telemetry:
  filename: "ESA-M1/ESA-M1(preprocessed)/labels_cleaned.csv"
  timestamp_col: "timestamp"
  subsystems: ["EPS", "ADCS", "COM", "Thermal"]
  n_synthetic_points: 500
  start_date: "2025-01-01 00:00:00"

# ─── Preprocessing ────────────────────────────────────────────────────────────
preprocessing:
  normalization: "minmax"       # "minmax" | "standard"
  interpolation_method: "linear"
  window_size: 30               # sliding window for LSTM sequences

# ─── Anomaly Detector ─────────────────────────────────────────────────────────
anomaly_detector:
  default_method: "zscore"      # active: "zscore"; research extras: "lstm" | "isolation_forest"
  window_size: 30
  latent_dim: 32
  model_path: "models/lstm_autoencoder.keras"
  reconstruction_thresholds:
    EPS: 0.05
    ADCS: 0.08
    COM: 0.06
    Thermal: 0.07
    default: 0.10
  threshold_percentile: 95.0

  # Isolation Forest
  isolation_forest:
    n_estimators: 100
    contamination: 0.05
    random_state: 42

  # Z-score
  zscore:
    window: 60
    min_periods: 10
    z_threshold: 3.5

# ─── Training ─────────────────────────────────────────────────────────────────
training:
  epochs: 20
  batch_size: 32
  validation_split: 0.1
  early_stopping_patience: 3

# ─── Mission Phases ───────────────────────────────────────────────────────────
mission_phases:
  - name: "Launch"
    fraction_start: 0.00
    fraction_end: 0.05
  - name: "Deployment"
    fraction_start: 0.05
    fraction_end: 0.15
  - name: "Commissioning"
    fraction_start: 0.15
    fraction_end: 0.30
  - name: "Operations"
    fraction_start: 0.30
    fraction_end: 0.90
  - name: "Decommissioning"
    fraction_start: 0.90
    fraction_end: 1.00

# ─── Risk Predictor ───────────────────────────────────────────────────────────
risk_predictor:
  persistence_window: 5         # aggregate last N flags before scoring
  thresholds:
    low: 0.30
    medium: 0.70
  criticality_matrix:
    EPS:
      Launch: 0.90
      Deployment: 0.85
      Commissioning: 0.80
      Operations: 0.80
      Decommissioning: 0.60
    ADCS:
      Launch: 0.70
      Deployment: 0.90
      Commissioning: 0.85
      Operations: 0.75
      Decommissioning: 0.50
    COM:
      Launch: 0.60
      Deployment: 0.70
      Commissioning: 0.75
      Operations: 0.80
      Decommissioning: 0.50
    Thermal:
      Launch: 0.80
      Deployment: 0.80
      Commissioning: 0.75
      Operations: 0.70
      Decommissioning: 0.60
    default:
      Launch: 0.70
      Deployment: 0.70
      Commissioning: 0.70
      Operations: 0.70
      Decommissioning: 0.50

# ─── Decision Logic ───────────────────────────────────────────────────────────
decision:
  mode: "rule"                  # active: "rule"; research extras: "rl"
  rl_timesteps: 2000
  rl_model_path: "archive/unverified_pipeline/ppo_decision_agent"

# ─── Backup Strategies ────────────────────────────────────────────────────────
backup_strategies:
  EPS:
    component: "primary_power"
    fallback: "backup_battery"
    trigger_levels: ["CRITICAL"]
    reason: "EPS critical anomaly — switch to backup battery"
  ADCS:
    component: "primary_gyro"
    fallback: "backup_magnetometer"
    trigger_levels: ["CRITICAL", "MEDIUM"]
    reason: "ADCS anomaly — switch to magnetometer attitude control"
  COM:
    component: "primary_tx"
    fallback: "reduced_tx_power"
    trigger_levels: ["CRITICAL"]
    reason: "COM critical — reduce transmit power to conserve EPS"
  Thermal:
    component: "primary_cpu"
    fallback: "reduced_cpu_load"
    trigger_levels: ["CRITICAL", "MEDIUM"]
    reason: "Thermal anomaly — reduce CPU load to lower heat"

# ─── Visualization ────────────────────────────────────────────────────────────
visualization:
  figsize: [12, 5]
  dpi: 100
  headless: true

# ─── Failure Scenario ─────────────────────────────────────────────────────────
failure_scenario:
  simulation:
    seed: 42
    sample_rate_hz: 1
    duration_seconds: 1800
    start_time: "2025-08-15T03:00:00"
  anomaly:
    t0_index: 900
    ramp_amplitude: 50.0
  baseline:
    T_base_mean: 35.0
    T_base_std: 0.4
    T_ambient_mean: 28.0
    T_ambient_std: 0.3
  detectors:
    rule:
      thr_T: 70.0
      rapid_rise_window_s: 10
      rapid_rise_delta: 3.0
    zscore:
      window_s: 180
      min_periods: 30
      z_thresh: 4.0
  output:
    telemetry_csv: "data/artifacts/failure_scenario_thermal.csv"
    metrics_csv: "data/artifacts/failure_scenario_metrics.csv"
    comparison_csv: "data/artifacts/comparison_metrics_all_models.csv"
    plots_prefix: "data/artifacts/failure_scenario_thermal"
  models:
    lstm_ae:
      enabled: false
    xgboost:
      enabled: false
  plot:
    show: false
    figsize: [10, 4]

# ─── Datasets ─────────────────────────────────────────────────────────────────
datasets:
  esa_m1:
    path: "data/raw/ESA-M1"
    label_col: "ID"
    description: "ESA Mission 1 metadata from Zenodo record 12528696"
  esa_m2:
    path: "data/raw/ESA-M2"
    label_col: "ID"
    description: "ESA Mission 2 metadata from Zenodo record 12528696"
  esa_m3:
    path: "data/raw/ESA-M3"
    label_col: "ID"
    description: "ESA Mission 3 metadata from Zenodo record 12528696"
  thermal_failure:
    path: "data/artifacts/failure_scenario_thermal.csv"
    label_col: "label_anomaly"
    description: "Synthetic thermal ramp failure scenario"
